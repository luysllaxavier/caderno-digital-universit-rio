<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderno Digital Universitario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Fundo Pontilhado (Dot Grid) */
    .bg-dot-grid {
      background-color: #fdfdfd;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 20px 20px;
    }
    
    /* Fundo Quadriculado (Graph Paper) */
    .bg-graph-grid {
      background-color: #fdfdfd;
      background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                        linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Sombra das Abas Laterais */
    .tab-shadow {
      box-shadow: 3px 0 6px -1px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-slate-200 h-screen w-screen overflow-hidden flex items-center justify-center p-2 sm:p-4 font-sans select-none">

  <!-- Tablet Shell / Container do Caderno -->
  <div class="relative w-full max-w-4xl h-[92vh] bg-white rounded-3xl shadow-2xl flex border-8 border-slate-800 overflow-hidden">

    <!-- ÁREA PRINCIPAL DO CADERNO -->
    <div class="flex-1 flex flex-col h-full relative">
      
      <!-- Barra Superior de Ferramentas (Toolbar) -->
      <header class="bg-slate-50/90 backdrop-blur border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-2 z-10">
        
        <!-- Título Estilizado -->
        <div class="flex items-center gap-2">
          <input type="text" value="SISTEMA CARDIOVASCULAR" class="bg-purple-100 text-purple-900 font-bold px-3 py-1 rounded-md text-sm border-none focus:outline-none focus:ring-2 focus:ring-purple-400 w-48 sm:w-64 tracking-wide shadow-sm" />
        </div>

        <!-- Seletor de Cores da Caneta -->
        <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-sm">
          <button onclick="setPenColor('#8b5cf6')" class="w-5 h-5 rounded-full bg-purple-500 border-2 border-white shadow hover:scale-110 transition"></button>
          <button onclick="setPenColor('#ec4899')" class="w-5 h-5 rounded-full bg-pink-500 border-2 border-white shadow hover:scale-110 transition"></button>
          <button onclick="setPenColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 border-2 border-white shadow hover:scale-110 transition"></button>
          <button onclick="setPenColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500 border-2 border-white shadow hover:scale-110 transition"></button>
          <button onclick="setPenColor('#1e293b')" class="w-5 h-5 rounded-full bg-slate-800 border-2 border-white shadow hover:scale-110 transition"></button>
        </div>

        <!-- Ferramentas (Caneta, Marca-texto, Borracha, Limpar) -->
        <div class="flex items-center gap-1 bg-white p-1 rounded-lg border border-slate-200 shadow-sm">
          <button id="btn-pen" onclick="setTool('pen')" class="p-1.5 rounded-md bg-purple-100 text-purple-700 hover:bg-slate-100"><i data-lucide="pen-tool" class="w-4 h-4"></i></button>
          <button id="btn-highlighter" onclick="setTool('highlighter')" class="p-1.5 rounded-md text-slate-600 hover:bg-slate-100"><i data-lucide="highlighter" class="w-4 h-4"></i></button>
          <button id="btn-eraser" onclick="setTool('eraser')" class="p-1.5 rounded-md text-slate-600 hover:bg-slate-100"><i data-lucide="eraser" class="w-4 h-4"></i></button>
          <div class="w-px h-4 bg-slate-200 mx-1"></div>
          <button onclick="togglePattern()" class="p-1.5 rounded-md text-slate-600 hover:bg-slate-100" title="Mudar Padrão do Papel"><i data-lucide="grid" class="w-4 h-4"></i></button>
          <button onclick="clearCanvas()" class="p-1.5 rounded-md text-red-500 hover:bg-red-50" title="Limpar Página"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </header>

      <!-- Folha de Papel (Canvas + Sticky Notes) -->
      <div id="paper-container" class="flex-1 relative bg-dot-grid overflow-hidden cursor-crosshair">
        
        <!-- Canvas para Desenho/Escrita -->
        <canvas id="noteCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

        <!-- Bloco de Notas Estilo Sticky Note (Aesthetic Box) -->
        <div class="absolute top-8 left-8 w-60 bg-purple-100/80 border border-purple-200 backdrop-blur-sm p-4 rounded-xl shadow-md z-10 pointer-events-auto">
          <div class="text-xs font-bold text-purple-800 uppercase tracking-wider mb-1">Definição</div>
          <p class="text-xs text-slate-700 leading-relaxed font-medium">É constituído pelo coração, os vasos sanguíneos e o sangue.</p>
        </div>

        <div class="absolute bottom-12 left-8 w-64 bg-pink-100/80 border border-pink-200 backdrop-blur-sm p-4 rounded-xl shadow-md z-10 pointer-events-auto">
          <div class="text-xs font-bold text-pink-800 uppercase tracking-wider mb-1">Vasos Sanguíneos</div>
          <p class="text-xs text-slate-700 leading-relaxed">Formam uma rede de tubos que transportam o sangue pelo corpo.</p>
        </div>
      </div>

    </div>

    <!-- ABAS LATERAIS COLORIDAS (DIVISÓRIAS 1 A 12) -->
    <div class="w-12 bg-slate-100 border-l border-slate-200 flex flex-col justify-around py-4 items-center z-20">
      <button onclick="switchTab(1)" class="tab-btn w-9 h-9 rounded-r-lg bg-purple-200 text-purple-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm border-l-2 border-purple-400">1</button>
      <button onclick="switchTab(2)" class="tab-btn w-9 h-9 rounded-r-lg bg-pink-200 text-pink-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">2</button>
      <button onclick="switchTab(3)" class="tab-btn w-9 h-9 rounded-r-lg bg-amber-200 text-amber-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">3</button>
      <button onclick="switchTab(4)" class="tab-btn w-9 h-9 rounded-r-lg bg-emerald-200 text-emerald-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">4</button>
      <button onclick="switchTab(5)" class="tab-btn w-9 h-9 rounded-r-lg bg-blue-200 text-blue-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">5</button>
      <button onclick="switchTab(6)" class="tab-btn w-9 h-9 rounded-r-lg bg-indigo-200 text-indigo-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">6</button>
      <button onclick="switchTab(7)" class="tab-btn w-9 h-9 rounded-r-lg bg-rose-200 text-rose-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">7</button>
      <button onclick="switchTab(8)" class="tab-btn w-9 h-9 rounded-r-lg bg-teal-200 text-teal-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">8</button>
      <button onclick="switchTab(9)" class="tab-btn w-9 h-9 rounded-r-lg bg-orange-200 text-orange-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">9</button>
      <button onclick="switchTab(10)" class="tab-btn w-9 h-9 rounded-r-lg bg-sky-200 text-sky-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">10</button>
      <button onclick="switchTab(11)" class="tab-btn w-9 h-9 rounded-r-lg bg-violet-200 text-violet-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">11</button>
      <button onclick="switchTab(12)" class="tab-btn w-9 h-9 rounded-r-lg bg-lime-200 text-lime-800 font-bold text-xs flex items-center justify-center hover:translate-x-1 transition shadow-sm">12</button>
    </div>

  </div>

  <!-- Scripts de Funcionalidade do Canvas e Interface -->
  <script>
    lucide.createIcons();

    const canvas = document.getElementById('noteCanvas');
    const ctx = canvas.getContext('2d');
    const paperContainer = document.getElementById('paper-container');

    let drawing = false;
    let currentColor = '#8b5cf6';
    let currentTool = 'pen'; // pen, highlighter, eraser

    // Ajusta resolução do canvas para o tamanho do container
    function resizeCanvas() {
      canvas.width = paperContainer.clientWidth;
      canvas.height = paperContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Lógica de Desenho
    function startDrawing(e) {
      drawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      if (currentTool === 'pen') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
      } else if (currentTool === 'highlighter') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor + '55'; // Aplica transparência
        ctx.lineWidth = 14;
        ctx.lineCap = 'square';
      } else if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 20;
      }

      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDrawing() {
      drawing = false;
    }

    // Eventos de Mouse e Touch
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    // Mudar Cor e Ferramenta
    function setPenColor(color) {
      currentColor = color;
      if (currentTool === 'eraser') setTool('pen');
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#btn-pen, #btn-highlighter, #btn-eraser').forEach(btn => {
        btn.classList.remove('bg-purple-100', 'text-purple-700');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`btn-${tool}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-purple-100', 'text-purple-700');
        activeBtn.classList.remove('text-slate-600');
      }
    }

    // Alternar Padrão de Fundo
    function togglePattern() {
      if (paperContainer.classList.contains('bg-dot-grid')) {
        paperContainer.classList.remove('bg-dot-grid');
        paperContainer.classList.add('bg-graph-grid');
      } else {
        paperContainer.classList.remove('bg-graph-grid');
        paperContainer.classList.add('bg-dot-grid');
      }
    }

    // Limpar Tela
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Trocar de Aba
    function switchTab(num) {
      clearCanvas();
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('border-l-2', 'border-purple-400'));
      event.target.classList.add('border-l-2', 'border-purple-400');
    }
  </script>
</body>
</html>
